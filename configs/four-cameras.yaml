cameras:
  - name: front_left
    device: /dev/video0
    width: 1280
    height: 720
    fps: 30 # NOTE: This is not working; but we set the frame sync setting below
    subsample_factor: 1
    settings:
      - name: vertical_flip
        value: 1
      - name: white_balance_automatic
        value: 0
      - name: frame_sync
        value: 1 # Frame Sync 30 Hz
        id: 0x009a092a
    format: UYVY
    req_buffer_count: 4
    transforms:
      - name: UYVY2RGB
  - name: front_right
    device: /dev/video1
    width: 1280
    height: 720
