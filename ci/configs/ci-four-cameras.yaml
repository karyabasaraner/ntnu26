cameras:
  - name: front_left
    device: /dev/video0
    width: 1280
    height: 720
    fps: 60
    subsample_factor: 2
    settings:
      - name: vertical_flip
        value: 1
    format: UYVY
    req_buffer_count: 4
    transforms:
      - name: UYVY2RGB
  - name: front_right
    device: /dev/video1
    width: 1280
    height: 720
    fps: 60
    subsample_factor: 2
    settings:
      - name: vertical_flip
        value: 1
    format: UYVY
    req_buffer_count: 4
    transforms:
      - name: UYVY2RGB
  - name: left
    device: /dev/video2
    width: 1280
    height: 720
    fps: 60
    subsample_factor: 2
    settings:
      - name: vertical_flip
        value: 1
    format: UYVY
    req_buffer_count: 4
    transforms:
      - name: UYVY2RGB
  - name: right
    device: /dev/video3
    width: 1280
    height: 720
    fps: 60
    subsample_factor: 2
    settings:
      - name: vertical_flip
        value: 1
    format: UYVY
    req_buffer_count: 4
    transforms:
      - name: UYVY2RGB
imus:
  - name: accelerometer
    device: "iio:device0"
    sampling_frequency: 1000 # Hz
    buffer_samples: 128
    cyclic_buffer: true
    channels:
      - "accel_x"
  - name: gyroscope
    device: "iio:device1"
    sampling_frequency: 1000 # Hz
    buffer_samples: 128
    cyclic_buffer: true
    channels:
      - "accel_x"
shared_memory:
  - name: front_left
    size_per_frame: 2764800 # 1280*720*3 bytes
    num_frames: 300 # 10 seconds at 30 fps
  - name: front_right
    size_per_frame: 2764800 # 1280*720*3 bytes
    num_frames: 300 # 10 seconds at 30 fps
  - name: left
    size_per_frame: 2764800 # 1280*720*3 bytes
    num_frames: 300 # 10 seconds at 30 fps
  - name: right
    size_per_frame: 2764800 # 1280*720*3 bytes
    num_frames: 300 # 10 seconds at 30 fps
