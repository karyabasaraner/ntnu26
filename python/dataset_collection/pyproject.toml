[project]
name = "dataset_collection"
version = "0.0.1"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "matplotlib",
    "pypylon",
    "psutil"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dataset_collection"]
